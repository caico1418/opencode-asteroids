name: Auto-etiquetar y enriquecer issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  etiquetar_y_enriquecer:
    runs-on: ubuntu-latest
    steps:
      - name: Etiquetar y anadir contexto al issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const texto = `${issue.title}\n\n${issue.body || ''}`.toLowerCase();

            const REGLAS = [
              { label: 'bug', palabras: ['bug', 'error', 'falla', 'fallo', 'problema', 'rompe', 'crash', 'glitch', 'no funciona', 'pantalla negra'] },
              { label: 'question', palabras: ['duda', 'pregunta', 'como', 'cómo', 'ayuda', 'help', 'que hago', 'qué hago', 'what'] },
              { label: 'documentation', palabras: ['docs', 'documentacion', 'documentación', 'readme'] },
              { label: 'accessibility', palabras: ['accesib', 'contraste'] },
              { label: 'enhancement', palabras: ['nueva', 'nuevo', 'mejora', 'mejorar', 'feature', 'agregar', 'añadir', 'implementar', 'implementa', 'necesitamos', 'necesita', 'necesito', 'mas grande', 'más grande', 'doble', 'extra', 'skin', 'power up', 'powerup', 'new', 'add'] },
            ];

            const MARCADOR = '## Contexto generado automáticamente';

            const labelsAplicar = [];
            for (const regla of REGLAS) {
              if (regla.palabras.some((p) => texto.includes(p))) {
                labelsAplicar.push(regla.label);
              }
            }

            if (labelsAplicar.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labelsAplicar,
              });
            }

            const yaTieneContexto = (issue.body || '').includes(MARCADOR);
            if (yaTieneContexto) {
              return;
            }

            const fecha = new Date().toISOString();
            const bloque = [
              '---',
              '',
              `## ${MARCADOR}`,
              '',
              `> **Información generada automáticamente al abrir el issue.** El texto original no fue modificado.`,
              '',
              `- **Repo**: \`${context.repo.owner}/${context.repo.repo}\``,
              `- **Issue**: [#${issue.number}](${issue.html_url})`,
              `- **Fecha (UTC)**: ${fecha}`,
              `- **SHA del workflow**: \`${context.sha}\``,
              `- **Archivos principales**: \`game.js\` (lógica completa del juego), \`index.html\` (canvas 800×600), \`favicon.svg\`.`,
              `- **Convenciones**: el código y los comentarios están en español; \`game.js\` contiene todas las clases (Bullet, Asteroid, Ship, Particle) y el bucle principal.`,
            ].join('\n');

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `${issue.body || ''}\n\n${bloque}`,
            });